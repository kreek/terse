name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Self-check the repo's prose
        run: node scripts/style-check.mjs README.md ROADMAP.md CHANGELOG.md evals/README.md docs/research/*.md skills/*/SKILL.md skills/*/references/*.md
