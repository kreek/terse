schema_version = "1.3"

[task]
name = "terse/flow-repair"
description = "Edit a stilted section so each paragraph reads as a connected explanation."

[metadata]
tags = ["editing"]

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${TERSE_EVAL_JUDGE:-claude-code}"
TERSE_EVAL_SKIP_JUDGE = "${TERSE_EVAL_SKIP_JUDGE:-}"
