# Synced from eval/verifier/shared/judge/quality.toml by eval/scripts/sync_tests.py. Do not edit in tasks/.
# sync_tests.py appends each task's [[criterion]] tables from its terse.json.
# REWARDKIT_JUDGE (set in task.toml [verifier.env]) overrides `judge` at run time.
# claude-code runs the judge through the Claude Code CLI, the one client that
# accepts a subscription token. It ignores `files` and `reasoning_effort`, so
# terse_lib.py `prepare` inlines the instruction and bundle into prompt.md and
# test.sh sets the CLI's effort. An LLM judge override reads `files` instead.
# isolated stays false: RewardKit isolates with an overlay mount, which fails in
# Harbor's unprivileged Docker trials. cwd is "/" because `claude -p` denies
# reads outside its working directory, and the inputs live under /tests and /logs.
[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
isolated = false
cwd = "/"
files = ["/tests/judge/instruction.md", "/logs/verifier/judge-bundle.md"]
prompt_template = "prompt.md"
reasoning_effort = "low"
timeout = 300

[scoring]
aggregation = "weighted-mean"

[[criterion]]
name = "accurate_content"
description = "Covers every supplied product fact without inventing features. Answer yes only if the post accurately covers QueueLens 1.0, RabbitMQ dead-letter queues, grouping by exception type, first and latest occurrence, NDJSON export, confirmed replay, the config path, local-only operation, Homebrew installation, and the MIT license. Fail for invented features or services."
type = "binary"
