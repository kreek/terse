# Synced from eval/verifier/shared/judge/quality.toml by eval/scripts/sync_tests.py. Do not edit in tasks/.
# sync_tests.py appends each task's [[criterion]] tables from its terse.json.
# REWARDKIT_JUDGE (set in task.toml [verifier.env]) overrides `judge` at run time.
# claude-code runs the judge through the Claude Code CLI, the one client that
# accepts a subscription token. It ignores `files` and `reasoning_effort`, so
# terse_lib.py `prepare` inlines the instruction and bundle into prompt.md and
# test.sh sets the CLI's effort. An LLM judge override reads `files` instead.
# isolated stays false: RewardKit isolates with an overlay mount, which fails in
# Harbor's unprivileged Docker trials. cwd is "/" because `claude -p` denies
# reads outside its working directory, and the inputs live under /tests and /logs.
[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
isolated = false
cwd = "/"
files = ["/tests/judge/instruction.md", "/logs/verifier/judge-bundle.md"]
prompt_template = "prompt.md"
reasoning_effort = "low"
timeout = 300

[scoring]
aggregation = "weighted-mean"

[[criterion]]
name = "accurate_requirements"
description = "The issue states every supplied requirement and invents none. Answer yes only if it covers the CSV export, all seven fields, the list filters, emailed links above 10,000 rows, ISO 8601 dates, and the Billing Admin restriction, and adds no requirement, field, or role the request did not give."
type = "binary"

# Calibrated 2026-10-02 on four claim-stack paragraphs and four well-linked ones
# (two Terse-style rewrites, a guide paragraph, and Hemingway), three runs each on
# claude-sonnet-5 at low effort. A yes/no form failed every sample. This 1-5 form
# averaged 2.75 on the claim stacks and 3.75 on the linked prose, so lift.py
# compares arm means rather than gating single trials on a threshold.
[[criterion]]
name = "flow"
description = "How well does each sentence follow from the one before it? Score from 1 to 5. 5: every link between sentences is clear; a reader never has to guess why one sentence follows another. 4: links are clear, with at most one place where the reader pauses to work out the connection. 3: several links the reader must work to recover, but each paragraph still holds together. 2: a paragraph reads partly as a stack of claims; the reader must guess why some sentences follow others, or a back reference or term has nothing to point at. 1: the paragraphs are stacks of unrelated claims. A link the reader can infer without effort needs no marker word. Lists, tables, headings, and code are exempt."
type = "likert"
points = 5
